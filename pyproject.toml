[tool.poetry]
name = "underactuated"
# Use e.g. 2023.10.4.rc0 if I need to release a release candidate.
# Use e.g. 2023.10.4.post1 if I need to rerelease on the same day.
version = "2026.9.8"
description = "MIT 6.821 - Underactuated Robotics"
authors = ["Russ Tedrake <russt@mit.edu>"]
license = "BSD License"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License"
]
include = [
    "LICENSE.txt",
    "README.md",
    "pyproject.toml",
    "underactuated/**/*.jpg",
    "underactuated/**/*.md",
    "underactuated/**/*.mtl",
    "underactuated/**/*.npy",
    "underactuated/**/*.obj",
    "underactuated/**/*.py",
    "underactuated/**/*.sdf",
    "underactuated/**/*.txt",
    "underactuated/**/*.urdf",
    "underactuated/**/*.xml",
    "underactuated/**/*.yaml"
]

exclude = [
    "*.egg-info/**",
    "**/__pycache__/**",
    "**/*.bazel",
    "**/test/**",
    "bazel-*",
    "book/**",
    "solutions/**",
    "figures/**"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "drake-nightly"
url = "https://drake-packages.csail.mit.edu/whl/nightly/"
priority = "explicit"

[tool.poetry.dependencies]
python = "<4.0,>=3.10"
#drake = { version = ">=0.0.20250328 <1.0", source = "drake-nightly" }
drake = ">=1.51.1"
gradescope-utils = { version=">=0.4.0", optional=true }
ipython = ">=8.39.0"
ipywidgets = { version=">=8.1.9" } # TODO: purge this 
lxml = {version = ">=6.1.3", extras = ["html_clean"], optional=true }
matplotlib = {version = ">=3.10.9", extras = ["mplot3d"]}
mpld3 = ">=0.5.12"
nbconvert = { version = ">=7.17.1", optional = true }
nbformat = { version = ">=5.11.1", optional = true }
numpy = ">=2.2.6"
pandas = { version=">=2.3.3", optional=true }
pillow = ">=12.3.0"
pydot = ">=4.0.1"
scipy = { version=">=1.15.3", optional=true }
# Minimum fixed version for Beautiful Soup's transitive selector dependency.
soupsieve = ">=2.9"
timeout-decorator = { version=">=0.4.1", optional=true }
tornado = { version = ">=6.5.8", optional = true }

[tool.poetry.extras]
grader = ["gradescope-utils", "nbconvert", "nbformat", "timeout-decorator", "tornado", ]
# 'all' should have all of the optional dependencies required to run any notebook in this repo.
all = [
  "gradescope-utils",
  "lxml",
  "nbconvert",
  "nbformat",
  "pandas",
  "scipy", 
  "timeout-decorator",
  "tornado"
]

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
# Must include all dependencies required to build the docs with sphinx +
# autodoc, even if it repeats some dependencies from main, because my sphinx
# script uses `poetry install --only docs`. This include any requirements
# needed to import for a file that sphinx autodoc is trying to index.
# Should match drake version above.
#drake = { version = ">=0.0.20250328 <1.0", source = "drake-nightly" }
drake = ">=1.51.1"
ipython = ">=8.39.0"
pillow = ">=12.3.0"
sphinx = ">=7.2.6"
myst-parser = ">=2.0.0"
sphinx_rtd_theme = ">=3.1.0"

[tool.poetry.group.dev.dependencies]
# These should not appear as requirements in any BUILD.bazel (except htmlbook)
beautifulsoup4 = ">=4.15.0"
black = { version = ">=26.5.1", extras = ["jupyter"] }
# Minimum fixed version for SecretStorage's Linux-only dependency.
cryptography = { version = ">=50.0.0", markers = "sys_platform == 'linux'" }
mysql-connector-python = ">=26.7.0"
packaging = ">=26.3"
pip-requirements-parser = ">=32.0"
poetry = ">=2.4.3,<2.5.0"  # https://github.com/python-poetry/poetry/issues/10184
pre-commit = ">=4.6.2"
pytest = ">=9.1.1"
pytest-timeout = ">=2.3.1"
requests = ">=2.34.2"

[tool.black]
include = '\.ipynb?$|\.pyi?$'
exclude = '''
/(
    \.git
  | \.history
  | bazel-*
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
skip_glob = [
  "**/.git/**",
  "**/.history/**",
  "bazel-*",
  "**/.venv/**",
  "**/build/**",
  "**/dist/**",
]

[tool.autoflake]
in-place = true
recursive = true
expand-star-imports = true
ignore-init-module-imports = true
remove-all-unused-imports = true
remove-duplicate-keys = true
remove-unused-variables = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = [
  "book",
  "solutions",
]
python_files = [
  "test_*.py",
]
markers = [
  "notebook: notebook execution tests",
]
